plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.audiocodecdebugger'
    compileSdk 35

    defaultConfig {
        applicationId 'com.example.audiocodecdebugger'
        minSdk 29
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
